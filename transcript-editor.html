<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>녹취록 편집기</title>
<style>
:root{
  --navy:#14284b; --navy2:#1f3a66; --accent:#2f6fdd; --bg:#e6e9ee; --panel:#f7f8fa; --line:#d3d8e0; --ink:#1c2430; --mute:#667085;
  --ok:#1a7f4b; --warn:#b26a00;
  --docfont:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo","Nanum Gothic","맑은 고딕",sans-serif;
  --fs:11pt; --lh:1.7; --m:22mm;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14px/1.45 "Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
/* title bar */
.titlebar{height:46px;background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding:0 14px;flex:none}
.logo{font-weight:700;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.logo i{width:22px;height:22px;border-radius:5px;background:#fff;color:var(--navy);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:13px}
.docname{background:rgba(255,255,255,.12);border:1px solid transparent;border-radius:6px;color:#fff;padding:5px 10px;min-width:220px;max-width:46vw;flex:0 1 420px}
.docname:focus{outline:none;background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.5)}
.sp{flex:1}
.saved{font-size:12px;opacity:.75}
.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 12px;line-height:1.2;white-space:nowrap}
.btn:hover{background:#eef2f8}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:#2560c4}
.btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
.btn.ghost:hover{background:rgba(255,255,255,.15)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
/* toolbar */
.toolbar{flex:none;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:6px 12px;flex-wrap:wrap}
.grp{display:flex;align-items:center;gap:2px;padding-right:8px;margin-right:2px;border-right:1px solid var(--line)}
.grp:last-child{border-right:0}
.tb{min-width:30px;height:30px;border:1px solid transparent;background:transparent;border-radius:5px;padding:0 7px}
.tb:hover{background:#eaf0fa;border-color:#cfd9ea}
.tb.on{background:#dce8fd;border-color:#a8c3f3}
.tsel{height:30px;border:1px solid var(--line);border-radius:5px;background:#fff;padding:0 6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:#fff;padding:5px 12px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--navy);color:#fff}
/* main */
.main{flex:1;display:flex;min-height:0}
.side{width:392px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line);background:#eef0f4}
.tabs button{flex:1;border:0;background:transparent;padding:10px 4px;border-bottom:3px solid transparent;font-weight:600;color:var(--mute)}
.tabs button.on{color:var(--navy);border-bottom-color:var(--accent);background:var(--panel)}
.pane{display:none;flex:1;overflow:auto;padding:12px}
.pane.on{display:block}
.pane h4{margin:14px 0 6px;font-size:12px;letter-spacing:.04em;color:var(--mute);text-transform:none}
.pane h4:first-child{margin-top:0}
textarea.src{width:100%;height:270px;resize:vertical;border:1px solid var(--line);border-radius:6px;padding:9px;background:#fff;line-height:1.6}
textarea.dict{width:100%;height:66px;resize:vertical;border:1px solid var(--line);border-radius:6px;padding:7px;background:#fff;font-size:13px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
.fld{display:grid;grid-template-columns:62px 1fr;gap:6px;align-items:center;margin:5px 0}
.fld label{color:var(--mute);font-size:12px}
.fld input{border:1px solid var(--line);border-radius:5px;padding:5px 8px;background:#fff;width:100%}
.chk{display:flex;align-items:center;gap:7px;margin:4px 0;font-size:13px}
.stats{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{background:#e4eaf5;color:var(--navy);border-radius:999px;padding:2px 10px;font-size:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin:7px 0;font-size:13px}
.card .meta{font-size:11.5px;color:var(--mute);margin-bottom:3px}
.card .ev{font-size:12px;color:var(--mute);border-left:3px solid #d6dbe6;padding-left:8px;margin-top:5px}
.card.dec{border-left:4px solid var(--ok)} .card.act{border-left:4px solid var(--accent)} .card.opn{border-left:4px solid var(--warn)}
.card.prop{border-left:4px solid #7a4bd6}
.empty{color:var(--mute);font-size:13px;padding:14px;text-align:center;border:1px dashed var(--line);border-radius:8px;background:#fff}
.hint{font-size:12px;color:var(--mute);margin:4px 0}
details{margin:8px 0}
summary{cursor:pointer;font-weight:600;color:var(--navy)}
/* work */
.work{flex:1;display:flex;min-width:0;min-height:0}
.view{flex:1;min-width:0;overflow:auto;padding:22px 18px 60px;display:none;justify-content:center;align-items:flex-start}
.view.on{display:flex}
.zoomer{transform-origin:top center}
.paper{width:210mm;min-height:297mm;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18),0 8px 24px rgba(20,40,75,.12);padding:var(--m)}
#editor{outline:none}
#editor:empty:before{content:"왼쪽 ‘원본’에 텍스트를 붙여넣고 ‘변환·정리 실행’을 누르거나, 여기에 직접 입력하세요.";color:#9aa3b2}
.pages{display:flex;flex-direction:column;gap:18px;align-items:center}
.page{width:210mm;height:296mm;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18),0 8px 24px rgba(20,40,75,.12);padding:var(--m);position:relative;overflow:hidden;flex:none}
.page .pc{height:100%;overflow:hidden}
.page .pn{position:absolute;left:0;right:0;bottom:8mm;text-align:center;font:9pt "Noto Sans KR","Malgun Gothic",sans-serif;color:#7b8494}
.work.split .view{padding:16px 8px 50px}
.work.split #viewEdit{border-right:1px solid var(--line)}
/* status */
.status{flex:none;height:28px;background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 12px;font-size:12px;color:var(--mute)}
.status input[type=range]{width:110px}
.toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);background:#1c2430;color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90vw}
.toast.on{opacity:1}
.find{display:none;background:#fff;border-bottom:1px solid var(--line);padding:6px 12px;gap:6px;align-items:center}
.find.on{display:flex}
.find input{border:1px solid var(--line);border-radius:5px;padding:4px 8px}
@media (max-width:980px){
  .main{flex-direction:column}
  .side{width:100%;height:42vh;border-right:0;border-bottom:1px solid var(--line)}
  .paper,.page{width:210mm}
  .docname{min-width:120px}
}
/* document typography (editor, preview, print) */
.doc{font-family:var(--docfont);font-size:var(--fs);line-height:var(--lh);color:#111;word-break:keep-all;overflow-wrap:break-word}
.doc h1{font-size:1.7em;line-height:1.3;margin:0 0 .3em;color:#14284b;border-bottom:2px solid #14284b;padding-bottom:.25em}
.doc h2{font-size:1.25em;margin:1.3em 0 .5em;color:#14284b;border-left:4px solid #14284b;padding-left:.5em;line-height:1.35}
.doc h3{font-size:1.06em;margin:1em 0 .35em;color:#1f3a66}
.doc p{margin:.4em 0}
.doc ul,.doc ol{margin:.4em 0;padding-left:1.4em}
.doc li{margin:.18em 0}
.doc table{border-collapse:collapse;width:100%;margin:.6em 0}
.doc th,.doc td{border:1px solid #9aa5b5;padding:.35em .6em;text-align:left;vertical-align:top}
.doc th{background:#eef2f7;width:22%}
.doc table.free th{width:auto}
.doc blockquote{margin:.6em 0;padding:.5em .9em;border-left:4px solid #c59a2e;background:#fbf7ea;color:#4a4332}
.doc .byline{color:#667085;margin:.2em 0 .8em}
.doc hr{border:0;border-top:1px solid #b7bfcc;margin:1em 0}
.doc mark{background:#fff2a8}
.pc>:first-child{margin-top:0}
/* print of the live page: show only the paginated mount */
#printMount{display:none}
#measure{position:fixed;left:-10000px;top:0;visibility:hidden;pointer-events:none}
@media print{
  @page{size:A4;margin:0}
  html,body{height:auto!important;overflow:visible!important;background:#fff!important;display:block!important}
  body>*:not(#printMount){display:none!important}
  #printMount{display:block!important}
  #printMount .page{box-shadow:none!important;margin:0!important;page-break-after:always;break-after:page}
  #printMount .page:last-child{page-break-after:auto;break-after:auto}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>

<div class="titlebar">
  <div class="logo"><i>녹</i>녹취록 편집기</div>
  <input id="docName" class="docname" value="제목 없는 녹취록" aria-label="문서 이름">
  <span class="saved" id="saved">자동 저장됨</span>
  <div class="sp"></div>
  <button class="btn ghost" id="bMd">Markdown 복사</button>
  <button class="btn ghost" id="bHtml">HTML 저장</button>
  <button class="btn pri" id="bPdf">PDF 저장 / 인쇄</button>
</div>

<div class="toolbar" id="toolbar">
  <div class="grp">
    <button class="tb" data-cmd="undo" title="실행 취소 (Ctrl+Z)">↶</button>
    <button class="tb" data-cmd="redo" title="다시 실행 (Ctrl+Y)">↷</button>
  </div>
  <div class="grp">
    <select class="tsel" id="blockSel" title="문단 스타일">
      <option value="P">본문</option><option value="H1">제목 1</option><option value="H2">제목 2</option><option value="H3">제목 3</option><option value="BLOCKQUOTE">인용·메모</option>
    </select>
  </div>
  <div class="grp">
    <button class="tb" data-cmd="bold" title="굵게 (Ctrl+B)"><b>B</b></button>
    <button class="tb" data-cmd="italic" title="기울임 (Ctrl+I)"><i>I</i></button>
    <button class="tb" data-cmd="underline" title="밑줄 (Ctrl+U)"><u>U</u></button>
    <button class="tb" id="bMark" title="형광펜">▍</button>
  </div>
  <div class="grp">
    <button class="tb" data-cmd="insertUnorderedList" title="글머리 기호">• 목록</button>
    <button class="tb" data-cmd="insertOrderedList" title="번호 목록">1. 목록</button>
    <button class="tb" data-cmd="outdent" title="내어쓰기">⇤</button>
    <button class="tb" data-cmd="indent" title="들여쓰기">⇥</button>
  </div>
  <div class="grp">
    <button class="tb" id="bTable" title="표 삽입">▦ 표</button>
    <button class="tb" id="bHr" title="구분선">─</button>
    <button class="tb" id="bFind" title="찾아 바꾸기 (Ctrl+F)">찾기</button>
  </div>
  <div class="grp">
    <select class="tsel" id="fontSel" title="글꼴"><option value="sans">고딕</option><option value="serif">명조</option></select>
    <select class="tsel" id="sizeSel" title="글자 크기"><option>10pt</option><option selected>11pt</option><option>12pt</option><option>13pt</option></select>
    <select class="tsel" id="lhSel" title="줄 간격"><option value="1.5">줄간격 1.5</option><option value="1.7" selected>줄간격 1.7</option><option value="1.9">줄간격 1.9</option></select>
    <select class="tsel" id="marSel" title="여백"><option value="15mm">여백 좁게</option><option value="22mm" selected>여백 보통</option><option value="30mm">여백 넓게</option></select>
  </div>
  <div class="sp"></div>
  <div class="seg" id="modeSeg">
    <button data-mode="edit" class="on">편집</button>
    <button data-mode="split">분할</button>
    <button data-mode="preview">미리보기</button>
  </div>
</div>

<div class="find" id="findBar">
  <input id="fFind" placeholder="찾을 말"> <input id="fRep" placeholder="바꿀 말">
  <button class="btn sm" id="fGo">모두 바꾸기</button>
  <span class="hint" id="fMsg"></span>
  <button class="btn sm" id="fClose">닫기</button>
</div>

<div class="main">
  <aside class="side">
    <div class="tabs" id="tabs">
      <button data-tab="src" class="on">① 원본·변환</button>
      <button data-tab="ana">② 맥락 분석</button>
      <button data-tab="sug">③ 후속 제안</button>
    </div>

    <div class="pane on" id="pane-src">
      <h4>원본 텍스트 (녹취·음성 인식 결과)</h4>
      <div class="row">
        <button class="btn sm" id="bSample">샘플</button>
        <button class="btn sm" id="bFile">파일 열기</button>
        <button class="btn sm" id="bMic">🎙 음성 입력</button>
        <button class="btn sm" id="bClear">지우기</button>
        <input type="file" id="fileIn" accept=".txt,.md,.srt,.vtt,.csv,text/plain" hidden>
      </div>
      <textarea class="src" id="src" placeholder="텍스트를 붙여넣거나 파일을 끌어다 놓으세요.&#10;지원 형식: ‘화자: 내용’, ‘[00:12] 화자: 내용’, ‘참석자 1 00:12’ + 다음 줄 내용, SRT·VTT, 일반 문단"></textarea>
      <div class="hint" id="srcInfo">0자</div>

      <h4>정리 옵션</h4>
      <label class="chk"><input type="checkbox" id="oFill" checked> 군더더기(어, 음, 저기…)·중복 단어 제거</label>
      <label class="chk"><input type="checkbox" id="oPunct" checked> 문장 부호 보정(마침표·물음표)</label>
      <label class="chk"><input type="checkbox" id="oMerge" checked> 같은 화자의 연속 발언 합치기</label>
      <label class="chk"><input type="checkbox" id="oTime"> 발언 시간 표기</label>
      <div class="fld" style="grid-template-columns:86px 1fr"><label>주제 분할</label><input type="range" id="oSens" min="0" max="5" value="3"></div>
      <div class="hint">왼쪽(0)은 한 덩어리, 오른쪽은 잘게 나눕니다.</div>
      <h4>오인식 교정 사전 (한 줄에 ‘틀린말=맞는말’)</h4>
      <textarea class="dict" id="dict" placeholder="도시계획 위원회=도시계획위원회"></textarea>

      <details open>
        <summary>문서 정보</summary>
        <div class="fld"><label>제목</label><input id="mTitle" placeholder="통화 기록 — ○○ 문의"></div>
        <div class="fld"><label>일시</label><input id="mWhen" placeholder="2026년 11월 16일 오전 10시"></div>
        <div class="fld"><label>발신</label><input id="mFrom"></div>
        <div class="fld"><label>수신</label><input id="mTo"></div>
        <div class="fld"><label>안건</label><input id="mAgenda" placeholder="비우면 자동 추출"></div>
        <div class="fld"><label>목적</label><input id="mPurpose"></div>
      </details>
      <div class="row" style="margin-top:12px">
        <button class="btn pri" id="bRun" style="flex:1;padding:10px">변환·정리 실행 →</button>
      </div>
      <div class="hint">실행하면 오른쪽 문서가 새로 생성됩니다. 직접 고친 내용이 있으면 덮어쓰기 전에 확인합니다.</div>
    </div>

    <div class="pane" id="pane-ana"><div class="empty">먼저 ‘① 원본·변환’에서 실행하세요.</div></div>
    <div class="pane" id="pane-sug"><div class="empty">먼저 ‘① 원본·변환’에서 실행하세요.</div></div>
  </aside>

  <section class="work" id="work">
    <div class="view on" id="viewEdit"><div class="zoomer" id="zEdit"><div class="paper doc" id="editor" contenteditable="true" spellcheck="false"></div></div></div>
    <div class="view" id="viewPrev"><div class="zoomer" id="zPrev"><div class="pages" id="pages"></div></div></div>
  </section>
</div>

<div class="status">
  <span id="stPages">미리보기: -</span>
  <span id="stChars">0자</span>
  <div class="sp"></div>
  <span>확대</span>
  <button class="btn sm" id="zMinus">−</button>
  <input type="range" id="zoom" min="50" max="140" value="100">
  <button class="btn sm" id="zPlus">+</button>
  <button class="btn sm" id="zFit">맞춤</button>
  <span id="zVal">100%</span>
</div>

<div id="measure" class="pages"></div>
<div id="printMount"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let toastT;function toast(m,ms){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),ms||2600)}

/* ================= 1. 파서 ================= */
function parseTranscript(raw){
  raw=raw.replace(/\r/g,'').replace(/^﻿/,'');
  const lines=raw.split('\n'), out=[]; let cur=null;
  const push=()=>{if(cur&&cur.text.trim())out.push(cur);cur=null};
  const srtTime=/^\d{1,2}:\d{2}:\d{2}[.,]\d{3}\s*-->/;
  for(let i=0;i<lines.length;i++){
    let l=lines[i].trim(), m;
    if(!l){push();continue}
    if(/^WEBVTT/.test(l))continue;
    if(/^\d+$/.test(l)&&srtTime.test((lines[i+1]||'').trim()))continue;
    if(srtTime.test(l)){push();cur={speaker:'',time:l.slice(0,8),text:''};continue}
    if((m=l.match(/^(.{1,20}?)\s+\[?(\d{1,2}:\d{2}(?::\d{2})?)\]?$/))&&!/[.?!,]$/.test(m[1])){push();cur={speaker:m[1].trim(),time:m[2],text:''};continue}
    if((m=l.match(/^\[?(\d{1,2}:\d{2}(?::\d{2})?)\]?\s+(.*)$/))){
      push();cur={speaker:'',time:m[1],text:''};l=m[2];
      const sm=l.match(/^([^\s\d:：.?!,][^:：.?!]{0,19})[:：]\s*(.*)$/);
      if(sm){cur.speaker=sm[1].trim();l=sm[2]}
      cur.text=l;continue;
    }
    if((m=l.match(/^([^\s\d:：.?!,"'“][^:：.?!]{0,19})[:：]\s*(.*)$/))){push();cur={speaker:m[1].trim(),time:'',text:m[2]};continue}
    if(!cur)cur={speaker:'',time:'',text:''};
    cur.text+=(cur.text?' ':'')+l;
  }
  push();
  return out;
}
function mergeSame(utts){
  const r=[];
  utts.forEach(u=>{const p=r[r.length-1];
    if(p&&u.speaker&&p.speaker===u.speaker){p.text+=' '+u.text}else r.push({...u})});
  return r;
}
function cleanText(t,o,dict){
  if(o.fill){
    t=t.replace(/(^|[\s,])(?:으*음+|어+|아+|뭐랄까|저기|그니까)(?=[\s,.?!]|$)/g,'$1');
    t=t.replace(/(^|\s)([가-힣A-Za-z0-9]{2,10})(?:[\s,]+\2)+(?=[\s,.?!]|$)/g,'$1$2');
  }
  dict.forEach(([a,b])=>{if(a)t=t.split(a).join(b)});
  t=t.replace(/\s+/g,' ').replace(/\s+([,.?!])/g,'$1').replace(/^[,\s]+/,'').trim();
  if(o.punct&&t&&!/[.?!…"'”’)\]]$/.test(t)) t+=/(습니까|입니까|ㅂ니까|나요|까요|가요)$/.test(t)?'?':'.';
  return t;
}
function parseDict(s){return s.split('\n').map(l=>{const i=l.indexOf('=');return i<1?null:[l.slice(0,i).trim(),l.slice(i+1).trim()]}).filter(Boolean)}
function sentences(t){return (t.match(/[^.?!。]+[.?!。]*/g)||[t]).map(s=>s.trim()).filter(Boolean)}

/* ================= 2. 주제 분할 ================= */
const SUF=['에서는','으로는','에게는','이라는','라고','에서','으로','에게','까지','부터','처럼','보다','한테','이다','입니다','했다','한다','하는','하고','하여','해서','이','가','은','는','을','를','에','의','로','와','과','도','만','들'];
const STOP=new Set('그리고 그런데 그래서 이것 저것 하지만 있는 없는 있다 하다 같은 때문 우리 제가 저는 그냥 정말 진짜 이렇게 그렇게 어떤 무슨 다시 이번 그것 그러면 그러나 합니다 했습니다 있습니다 됩니다 해서 하면 이후 먼저 다만 아니 아니라 경우 부분 관련 내용 말씀 생각 정도'.split(' '));
function kwMap(text){
  const m=new Map();
  (text.match(/[가-힣A-Za-z0-9]{2,}/g)||[]).forEach(w=>{
    for(const s of SUF){if(w.length>=s.length+1&&w.endsWith(s)){w=w.slice(0,-s.length);break}}
    if(w.length<2||STOP.has(w)||/^\d+$/.test(w)||/(습니다|니다|세요|어요|아요|해요|네요|까요|지만|다고|라고|하고|해서|하면|으면|는데|인데|지요|드립니다|하겠|있는|없는|[다요죠까며서])$/.test(w))return;
    m.set(w,(m.get(w)||0)+1);
  });
  return m;
}
function mergeMaps(a){const r=new Map();a.forEach(m=>m.forEach((v,k)=>r.set(k,(r.get(k)||0)+v)));return r}
function cosine(a,b){let d=0,na=0,nb=0;a.forEach((v,k)=>{na+=v*v;if(b.has(k))d+=v*b.get(k)});b.forEach(v=>nb+=v*v);return na&&nb?d/Math.sqrt(na*nb):0}
function segment(utts,sens){
  const n=utts.length;
  if(n<6||sens===0)return [utts.map((_,i)=>i)];
  const v=utts.map(u=>kwMap(u.text)), W=2, minLen=3;
  const th=[0,.03,.06,.1,.15,.2][sens];
  const cue=/^(다음으로|그럼 다음|두 번째|둘째|마지막으로|다른 건|다른 것|그리고 다음)/;
  const bounds=[0]; let last=0;
  for(let i=1;i<n;i++){
    const L=mergeMaps(v.slice(Math.max(0,i-W),i)), R=mergeMaps(v.slice(i,i+W));
    if(i-last>=minLen&&n-i>=minLen-1&&(cue.test(utts[i].text)||cosine(L,R)<=th)){bounds.push(i);last=i}
  }
  bounds.push(n);
  const g=[];for(let b=0;b<bounds.length-1;b++){const a=[];for(let i=bounds[b];i<bounds[b+1];i++)a.push(i);g.push(a)}
  return g;
}
function topKeys(text,k){
  const m=kwMap(text);return [...m.entries()].sort((a,b)=>b[1]-a[1]||b[0].length-a[0].length).slice(0,k).map(e=>e[0]);
}

/* ================= 3. 맥락 분석 ================= */
const RE={
  decision:/(하기로|하겠습니다|하겠다|결정|확정|합의|승인|진행하겠|공정하게|약속)/,
  action:/(해 ?주세요|해 ?달라|해 ?주시|부탁|요청|제출|송부|전달|보내|확인해|검토|공유|회신|통보|알려|연락)/,
  open:/(미정|아직|확정되지|모르|불확실|어렵|불가|안 ?됩니다|안 ?돼|못 ?합|못 ?한|검토 ?중|논의가 필요|확인이 필요|접수되지|없었)/,
  date:/(\d{4}년\s*)?\d{1,2}월\s*\d{1,2}일|내일|모레|다음 ?주|이번 ?주|금주|월말|\d{1,2}일까지|오늘/,
  fact:/(\d{4}년\s*)?\d{1,2}월\s*\d{1,2}일|\d[\d,.]*\s*(?:%|퍼센트|원|만원|억원|억|명|건|개|kW|MW|㎿|㎾|시간|시|분|주|㎡|m)/g
};
function analyze(utts){
  const S=[];utts.forEach((u,ui)=>sentences(u.text).forEach(s=>S.push({s,speaker:u.speaker,ui})));
  const decisions=S.filter(x=>RE.decision.test(x.s)&&!/[?]$/.test(x.s));
  const actions=S.filter(x=>RE.action.test(x.s)&&!/[?]$/.test(x.s)).map(x=>({...x,due:(x.s.match(RE.date)||[''])[0]}));
  const open=S.filter(x=>RE.open.test(x.s));
  const qa=[];
  utts.forEach((u,i)=>sentences(u.text).forEach(s=>{
    if(/\?$/.test(s)){const nx=utts[i+1];qa.push({q:s,speaker:u.speaker,a:nx&&nx.speaker!==u.speaker?nx.text:'',ui:i})}
  }));
  const facts=[];
  S.forEach(x=>{(x.s.match(RE.fact)||[]).forEach(f=>{if(!facts.some(y=>y.f===f.trim()))facts.push({f:f.trim(),s:x.s})})});
  const speakers=[...new Set(utts.map(u=>u.speaker).filter(Boolean))];
  return {S,decisions,actions,open,qa,facts,speakers};
}
function makeProposals(a){
  const P=[];
  const has=(re,list)=>list.find(x=>re.test(x.s));
  const sendEv=has(/제출|의견서|공문|서면/,a.actions)||has(/불가|어렵|못 ?한|못 ?합/,a.open);
  if(sendEv)P.push({title:'공문·의견서로 공식 제출',detail:'구두 전달에 그친 내용을 서면(공문 또는 의견서)으로 제출하고, 처리 방법과 회신을 명시적으로 요청합니다.',ev:sendEv.s});
  const schedEv=has(/미정|아직|접수되지|확정되지|일정/,a.open);
  if(schedEv)P.push({title:'일정·진행 상황 변동 시 통보 요청',detail:'일정이 확정되거나 접수 등 다음 단계가 진행되면 알려 달라고 요청하고, 연락 담당자를 지정합니다.',ev:schedEv.s});
  const infoEv=a.S.find(x=>/(자문|결과|자료|보완|지적)/.test(x.s)&&/(확인|모르|궁금|파악|것 같)/.test(x.s));
  if(infoEv)P.push({title:'관련 자료 공개·열람 요청 검토',detail:'언급된 자문·결과·자료의 내용을 확인할 수 있도록 정보공개청구 또는 열람 요청을 검토합니다.',ev:infoEv.s});
  const altEv=has(/불가|어렵|못 ?한|못 ?합|안 ?됩니다|안 ?돼/,a.open);
  if(altEv)P.push({title:'대체 경로 확보',detail:'직접 참여가 어려운 경우를 대비해 서면 진술, 간접 전달, 담당 부서를 통한 설명 요청 등 다른 경로를 확보합니다.',ev:altEv.s});
  const used=new Set(P.map(p=>p.ev));
  a.actions.filter(x=>!used.has(x.s)).slice(0,4).forEach(x=>{
    P.push({title:'후속 조치: '+(x.s.length>40?x.s.slice(0,40)+'…':x.s),detail:(x.speaker?x.speaker+' 발언 기준. ':'')+(x.due?'기한 언급: '+x.due+'. ':'')+'담당자와 기한을 정해 이행 여부를 확인합니다.',ev:x.s});
  });
  P.push({title:'처리 현황 확인 일정 등록',detail:'요청 후 7일 정도 뒤에 회신 여부를 확인하는 일정을 잡고, 결과를 이 문서에 이어서 기록합니다.',ev:''});
  return P.map((p,i)=>({...p,id:i,on:true}));
}

/* ================= 4. 문서 생성 ================= */
function boldFacts(t){
  return esc(t).replace(/((?:\d{4}년\s*)?\d{1,2}월\s*\d{1,2}일|\d[\d,.]*\s*(?:%|퍼센트|원|만원|억원|억|명|건|㎿|MW|kW|시간)(?![가-힣]))/g,'<strong>$1</strong>');
}
function buildDoc(S){
  const {utts,groups,ana,meta,props,opts}=S;
  const title=meta.title||('녹취록 — '+(ana.speakers.join(', ')||'기록'));
  const agenda=meta.agenda||topKeys(utts.map(u=>u.text).join(' '),4).join(' · ');
  let h='<h1>'+esc(title)+'</h1>';
  h+='<p class="byline">'+esc(meta.date||new Date().toISOString().slice(0,10))+' · 자동 정리 초안</p>';
  h+='<h2>1. 개요</h2><table><tbody><tr><th>항목</th><th>내용</th></tr>';
  const rows=[['일시',meta.when],['발신',meta.from],['수신',meta.to]];
  if(!meta.from&&!meta.to&&ana.speakers.length)rows.push(['참석자',ana.speakers.join(', ')]);
  rows.push(['안건',agenda],['목적',meta.purpose]);
  rows.forEach(r=>{if(r[1])h+='<tr><td>'+esc(r[0])+'</td><td>'+esc(r[1])+'</td></tr>'});
  h+='</tbody></table>';
  h+='<h2>2. 주요 내용</h2>';
  groups.forEach((g,gi)=>{
    const text=g.map(i=>utts[i].text).join(' ');
    const label=topKeys(text,2).join(' · ')||('구간 '+(gi+1));
    if(groups.length>1||true)h+='<h3>2-'+(gi+1)+'. '+esc(label)+'</h3>';
    h+='<ul>';
    g.forEach(i=>{
      const u=utts[i];
      h+='<li>'+(u.speaker?'<strong>'+esc(u.speaker)+':</strong> ':'')+(opts.time&&u.time?'<span style="color:#7b8494">['+esc(u.time)+']</span> ':'')+boldFacts(u.text)+'</li>';
    });
    h+='</ul>';
  });
  h+='<h2>3. 확인된 사항 요약</h2>';
  const sum=[];
  const seen=new Set();
  const add=(x,pre)=>{if(x&&!seen.has(x.s)&&sum.length<8){seen.add(x.s);sum.push((pre?'<strong>'+pre+'</strong> ':'')+boldFacts(x.s))}};
  ana.decisions.slice(0,4).forEach(x=>add(x,'결정·약속:'));
  ana.open.slice(0,4).forEach(x=>add(x,'미정·제한:'));
  if(!sum.length){
    const sc=ana.S.map(x=>({x,k:[...kwMap(x.s).keys()].length+(RE.fact.test(x.s)?2:0)})).sort((a,b)=>b.k-a.k).slice(0,5).map(o=>o.x);
    RE.fact.lastIndex=0;sc.forEach(x=>add(x,''));
  }
  RE.fact.lastIndex=0;
  h+='<ol>'+sum.map(s=>'<li>'+s+'</li>').join('')+'</ol>';
  h+='<h2>4. 미해결 사항 및 후속 조치(안)</h2>';
  h+='<blockquote>아래는 원본 내용을 바탕으로 자동 생성한 제안이며, 당사자 간에 합의된 사항이 아닙니다.</blockquote>';
  h+='<ul data-sec="followup">';
  ana.open.slice(0,3).forEach(x=>{h+='<li><strong>미해결:</strong> '+esc(x.s)+'</li>'});
  props.filter(p=>p.on).forEach((p,i)=>{h+='<li><strong>제안 '+(i+1)+' — '+esc(p.title)+':</strong> '+esc(p.detail)+'</li>'});
  h+='</ul>';
  h+='<h2>5. 참고</h2><ul><li>본 기록은 원본 텍스트('+utts.length+'개 발언)를 규칙 기반으로 자동 정리한 초안입니다. 음성 인식 오류가 남아 있을 수 있으므로 대외 인용 전에 원본을 확인하세요.</li>';
  h+='<li>정리 옵션: '+[opts.fill?'군더더기 제거':'',opts.punct?'문장 부호 보정':'',opts.merge?'연속 발언 합치기':'',groups.length>1?'주제 '+groups.length+'개 구간 분할':''].filter(Boolean).join(', ')+'.</li></ul>';
  return h;
}

/* ================= 5. 상태·UI ================= */
let STATE=null;                 // 마지막 분석 결과
const editor=$('#editor');
const meta=()=>({title:$('#mTitle').value.trim(),when:$('#mWhen').value.trim(),from:$('#mFrom').value.trim(),to:$('#mTo').value.trim(),agenda:$('#mAgenda').value.trim(),purpose:$('#mPurpose').value.trim(),date:detectDate()});
function detectDate(){
  const m=$('#src').value.match(/(\d{4})년\s*(\d{1,2})월\s*(\d{1,2})일/);
  return m?m[1]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[3]).padStart(2,'0'):new Date().toISOString().slice(0,10);
}
function opts(){return{fill:$('#oFill').checked,punct:$('#oPunct').checked,merge:$('#oMerge').checked,time:$('#oTime').checked}}

function run(force){
  const raw=$('#src').value;
  if(!raw.trim()){toast('원본 텍스트를 먼저 입력하세요.');return}
  if(!force&&editor.dataset.dirty==='1'&&!confirm('직접 수정한 문서가 새 결과로 바뀝니다. 계속할까요?'))return;
  const o=opts(), dict=parseDict($('#dict').value);
  let utts=parseTranscript(raw);
  if(o.merge)utts=mergeSame(utts);
  utts=utts.map(u=>({...u,text:cleanText(u.text,o,dict)})).filter(u=>u.text);
  if(!utts.length){toast('분석할 문장이 없습니다.');return}
  const groups=segment(utts,+$('#oSens').value);
  const ana=analyze(utts), props=makeProposals(ana);
  STATE={utts,groups,ana,props,opts:o};
  STATE.meta=meta();
  if(!$('#mTitle').value&&ana.speakers.length){/* 제목은 비워 두면 자동 */}
  editor.innerHTML=buildDoc(STATE);
  editor.dataset.dirty='0';
  const t=STATE.meta.title||'녹취록';$('#docName').value=t;
  renderAna();renderSug();onDocChange(true);
  toast('정리 완료: 발언 '+utts.length+'개 · 주제 '+groups.length+'개 · 제안 '+props.length+'건');
}

function makeDraft(kind){

function normalizeSrc(html){
  const box=document.createElement('div');box.innerHTML=html;
  [...box.childNodes].forEach(n=>{
    if(n.nodeType===3){if(n.nodeValue.trim()){const p=document.createElement('p');n.replaceWith(p);p.textContent=n.nodeValue}else n.remove()}
    else if(n.nodeType===1&&/^(DIV|SPAN|FONT|B|I|U|STRONG|EM)$/.test(n.tagName)&&!n.querySelector('p,ul,ol,table,h1,h2,h3,blockquote')){const p=document.createElement('p');p.innerHTML=n.innerHTML;n.replaceWith(p)}
  });
  box.querySelectorAll('[contenteditable]').forEach(x=>x.removeAttribute('contenteditable'));
  return box;
}
function paginate(html,container){
  container.innerHTML='';
  const src=normalizeSrc(html);
  let page,pc;
  const newPage=()=>{page=document.createElement('div');page.className='page';pc=document.createElement('div');pc.className='pc doc';page.appendChild(pc);container.appendChild(page)};
  const over=()=>pc.scrollHeight>pc.clientHeight+1;
  const brk=()=>{
    const last=pc.lastElementChild;let carry=null;
    if(last&&/^H[1-6]$/.test(last.tagName)&&pc.children.length>1){carry=last;pc.removeChild(last)}
    newPage();if(carry)pc.appendChild(carry);
  };
  const splitItems=(node,items,mkShell,setupShell)=>{
    node.innerHTML='';let shell=node,count=0;
    pc.appendChild(shell);setupShell&&setupShell(shell,0);
    items.forEach(it=>{
      shell.appendChild(it);
      if(over()){
        if(shell.children.length>1){
          shell.removeChild(it);brk();shell=mkShell();pc.appendChild(shell);setupShell&&setupShell(shell,count);shell.appendChild(it);
        }else if(pc.children.length>1){
          pc.removeChild(shell);brk();pc.appendChild(shell);
        }
      }
      count++;
    });
  };
  newPage();
  [...src.children].forEach(node=>{
    pc.appendChild(node);
    if(!over())return;
    const tag=node.tagName;
    if((tag==='UL'||tag==='OL')&&node.children.length>1){
      const items=[...node.children],base=parseInt(node.getAttribute('start')||'1',10);
      pc.removeChild(node);
      splitItems(node,items,()=>node.cloneNode(false),(sh,c)=>{if(tag==='OL')sh.setAttribute('start',base+c)});
      return;
    }
    if(tag==='TABLE'){
      const trs=[...node.querySelectorAll('tr')];
      if(trs.length>2){
        const head=trs[0].querySelector('th')?trs.shift():null;
        pc.removeChild(node);
        const mk=()=>{const t=node.cloneNode(false);const tb=document.createElement('tbody');t.appendChild(tb);return t};
        let cur=mk(),tb=cur.firstChild;
        if(head)tb.appendChild(head.cloneNode(true));
        pc.appendChild(cur);
        trs.forEach(tr=>{
          tb.appendChild(tr);
          if(over()){
            if(tb.children.length>(head?2:1)){
              tb.removeChild(tr);brk();cur=mk();tb=cur.firstChild;if(head)tb.appendChild(head.cloneNode(true));pc.appendChild(cur);tb.appendChild(tr);
            }else if(pc.children.length>1){pc.removeChild(cur);brk();pc.appendChild(cur)}
          }
        });
        return;
      }
    }
    if(pc.children.length>1){pc.removeChild(node);brk();pc.appendChild(node)}
  });
  if(!pc.children.length&&container.children.length>1)container.removeChild(page);
  const pages=[...container.children];
  pages.forEach((p,i)=>{const n=document.createElement('div');n.className='pn';n.textContent=(i+1)+' / '+pages.length;p.appendChild(n)});
  return pages.length;
}

function toMarkdown(){
  const box=normalizeSrc(editor.innerHTML);
  const inl=n=>{let s='';n.childNodes.forEach(c=>{
    if(c.nodeType===3)s+=c.nodeValue;
    else if(/^(STRONG|B)$/.test(c.tagName))s+='**'+inl(c)+'**';
    else if(/^(EM|I)$/.test(c.tagName))s+='*'+inl(c)+'*';
    else if(c.tagName==='BR')s+='\n';
    else s+=inl(c)});return s};
  const lst=(l,d)=>[...l.children].map((li,i)=>{
    const sub=[...li.children].filter(x=>/^(UL|OL)$/.test(x.tagName));
    const own=[...li.childNodes].filter(x=>!(x.nodeType===1&&/^(UL|OL)$/.test(x.tagName))).map(x=>x.nodeType===3?x.nodeValue:inl(x)).join('').trim();
    return '    '.repeat(d)+(l.tagName==='OL'?(i+1)+'. ':'- ')+own+(sub.length?'\n'+sub.map(s=>lst(s,d+1)).join('\n'):'');
  }).join('\n');
  const out=[];
  [...box.children].forEach(n=>{
    const t=n.tagName;
    if(/^H[1-6]$/.test(t))out.push('#'.repeat(+t[1])+' '+inl(n).trim());
    else if(t==='UL'||t==='OL')out.push(lst(n,0));
    else if(t==='BLOCKQUOTE')out.push('> '+inl(n).trim());
    else if(t==='HR')out.push('---');
    else if(t==='TABLE'){const rs=[...n.querySelectorAll('tr')].map(r=>'| '+[...r.children].map(c=>inl(c).trim().replace(/\|/g,'\\|')).join(' | ')+' |');if(rs.length){const cols=n.querySelector('tr').children.length;rs.splice(1,0,'|'+' --- |'.repeat(cols));out.push(rs.join('\n'))}}
    else out.push(inl(n).trim());
  });
  return out.join('\n\n');
}

  $('#stChars').textContent=editor.innerText.replace(/\s/g,'').length.toLocaleString()+'자';
  $('#saved').textContent='저장 중…';
  clearTimeout(saveT);saveT=setTimeout(()=>{
    store.set('te.doc',editor.innerHTML);store.set('te.name',$('#docName').value);
    store.set('te.meta',JSON.stringify(['mTitle','mWhen','mFrom','mTo','mAgenda','mPurpose'].map(i=>$('#'+i).value)));
    store.set('te.dict',$('#dict').value);
    $('#saved').textContent='자동 저장됨';
  },600);
  schedPreview();
}
editor.addEventListener('input',()=>onDocChange());
$('#docName').addEventListener('input',()=>onDocChange());
document.addEventListener('selectionchange',()=>{
  if(document.activeElement!==editor)return;
  try{['bold','italic','underline'].forEach(c=>{const b=$('[data-cmd="'+c+'"]');b&&b.classList.toggle('on',document.queryCommandState(c))})}catch(e){}
});
editor.addEventListener('paste',e=>{ // 서식 없이 붙여넣기(깨짐 방지)
  e.preventDefault();const t=(e.clipboardData||window.clipboardData).getData('text/plain');
  document.execCommand('insertText',false,t);
});
$('#bRun').addEventListener('click',()=>run(false));

/* 초기화 */
(function init(){
  $('#src').value=store.get('te.src','');
  $('#srcInfo').textContent=$('#src').value.length.toLocaleString()+'자';
  $('#dict').value=store.get('te.dict','');
  try{JSON.parse(store.get('te.meta','[]')).forEach((v,i)=>{const id=['mTitle','mWhen','mFrom','mTo','mAgenda','mPurpose'][i];if(id)$('#'+id).value=v||''})}catch(e){}
  $('#docName').value=store.get('te.name','제목 없는 녹취록');
  try{const L=JSON.parse(store.get('te.look','null'));if(L){$('#fontSel').value=L[0];$('#sizeSel').value=L[1];$('#lhSel').value=L[2];$('#marSel').value=L[3]}}catch(e){}
  applyLook();
  editor.innerHTML=store.get('te.doc','');
  onDocChange(true);
  setMode(store.get('te.mode','edit')==='preview'?'preview':store.get('te.mode','edit'));
  window.__te={paginate,run,toMarkdown,fullHtml,get state(){return STATE}};
})();
})();
</script>
</body>
</html>
