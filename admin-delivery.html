<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>배달 목록 - 산내면 콩두부</title>
<style>
  :root{--bg:#f4f1ea;--card:#fff;--ink:#2b2a26;--muted:#6b675d;--main:#b5651d;--dark:#8a4a12;--line:#e3dccb;--ok:#2e7d4f;--okbg:#e6f4ec}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;font-size:17px;line-height:1.45}
  header{background:var(--dark);color:#fff;padding:14px 16px;text-align:center}
  header h1{margin:0;font-size:1.3rem}
  nav{display:flex;gap:6px;max-width:760px;margin:0 auto;padding:10px 16px 0;font-size:.85rem}
  nav a{flex:1;text-align:center;padding:8px 4px;border-radius:8px;color:var(--muted);text-decoration:none;background:#e8e0cc}
  nav a.on{background:var(--dark);color:#fff;font-weight:700}
  main{max-width:760px;margin:0 auto;padding:14px 16px 40px}
  .datebar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .datebar button{width:48px;height:48px;font-size:1.4rem;border:none;border-radius:10px;background:var(--main);color:#fff;cursor:pointer}
  .datebar .d{flex:1;text-align:center;font-size:1.15rem;font-weight:700}
  .datebar .d small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
  .datebar input{position:absolute;opacity:0;pointer-events:none;width:0}
  .today{padding:0 12px!important;width:auto!important;font-size:.9rem!important;background:#fff!important;color:var(--dark)!important;border:2px solid var(--main)!important}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
  .stat b{display:block;font-size:1.5rem;color:var(--dark)}
  .stat span{font-size:.8rem;color:var(--muted)}
  .bar{height:10px;background:#e3dccb;border-radius:6px;overflow:hidden;margin-bottom:14px}
  .bar i{display:block;height:100%;background:var(--ok);transition:width .2s}
  .filters{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
  .filters button{padding:9px 14px;border:2px solid var(--line);border-radius:20px;background:#fff;font-size:.9rem;cursor:pointer}
  .filters button.on{border-color:var(--main);background:#fff3e3;font-weight:700;color:var(--dark)}
  .item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
  .item.done{background:var(--okbg);border-color:#b9dfc9}
  .no{width:32px;height:32px;border-radius:50%;background:var(--main);color:#fff;display:grid;place-items:center;font-weight:700;flex:none;font-size:.9rem}
  .item.done .no{background:var(--ok)}
  .info{flex:1;min-width:0}
  .info b{display:block}
  .info small{color:var(--muted);font-size:.8rem}
  .tag{display:inline-block;font-size:.7rem;padding:1px 6px;border-radius:6px;background:#fff3e3;color:var(--dark);margin-left:4px}
  .tag.rep{background:#e6eefc;color:#2a4a8a}
  .qty{font-size:1.3rem;font-weight:700;text-align:right;flex:none}
  .qty small{font-size:.75rem;font-weight:400;color:var(--muted)}
  .chk{flex:none;padding:12px 14px;border:2px solid var(--ok);border-radius:10px;background:#fff;color:var(--ok);font-weight:700;font-size:.95rem;cursor:pointer}
  .item.done .chk{background:var(--ok);color:#fff}
  .empty{text-align:center;color:var(--muted);padding:40px 0;background:#fff;border-radius:12px;border:1px dashed var(--line)}
  .note{text-align:center;color:var(--muted);font-size:.8rem;margin-top:14px}
  @media print{nav,.datebar button,.filters,.chk,header{display:none}body{background:#fff}}
</style>
</head>
<body>
<header><h1>🚚 배달 목록 <span style="font-size:.7rem;opacity:.8">(화면 시안)</span></h1></header>
<nav>
  <a href="index.html">주문하기</a>
  <a href="admin-order.html">대리 주문</a>
  <a class="on" href="admin-delivery.html">배달 목록</a>
  <a href="admin-dashboard.html">대시보드</a>
  <a href="admin-payment.html">입금 관리</a>
</nav>

<main>
  <div class="datebar">
    <button id="prev" aria-label="전날">‹</button>
    <div class="d" id="dateLabel"></div>
    <button id="next" aria-label="다음날">›</button>
    <button class="today" id="today">오늘</button>
    <input type="date" id="picker">
  </div>

  <div class="stats">
    <div class="stat"><b id="sPlaces">0</b><span>배달 장소</span></div>
    <div class="stat"><b id="sQty">0</b><span>준비할 총 모 수</span></div>
    <div class="stat"><b id="sDone">0</b><span>배달 완료</span></div>
  </div>
  <div class="bar"><i id="progress" style="width:0"></i></div>

  <div class="filters" id="filters">
    <button data-f="all" class="on">전체</button>
    <button data-f="경로당">경로당</button>
    <button data-f="캠핑장">캠핑장</button>
    <button data-f="todo">미배달만</button>
  </div>

  <div id="list"></div>
  <p class="note">인쇄하면 배달 기사용 목록으로 사용할 수 있습니다. 완료 체크는 시안 단계라 새로고침 시 초기화됩니다.</p>
</main>

<script>
// ===== 샘플 주문 데이터 (이후 서버 데이터로 교체) =====
const iso = d => { const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4); return z.toISOString().slice(0,10); };
const base = new Date();
const off = n => { const d=new Date(base); d.setDate(d.getDate()+n); return iso(d); };
const ORDERS = [
  {id:1,date:off(0),type:"경로당",place:"경로당 01 (임시)",qty:5,repeat:"",memo:"뒷문 앞",tel:"010-1111-0001"},
  {id:2,date:off(0),type:"경로당",place:"경로당 07 (임시)",qty:3,repeat:"매주 화",memo:"",tel:"010-1111-0007"},
  {id:3,date:off(0),type:"캠핑장",place:"캠핑장 02 (임시)",qty:12,repeat:"",memo:"관리동 냉장고",tel:"010-2222-0002"},
  {id:4,date:off(0),type:"캠핑장",place:"캠핑장 11 (임시)",qty:8,repeat:"매주 화",memo:"",tel:"010-2222-0011"},
  {id:5,date:off(0),type:"경로당",place:"경로당 15 (임시)",qty:4,repeat:"",memo:"",tel:"010-1111-0015"},
  {id:6,date:off(1),type:"경로당",place:"경로당 21 (임시)",qty:6,repeat:"격주 수",memo:"",tel:"010-1111-0021"},
  {id:7,date:off(1),type:"캠핑장",place:"캠핑장 05 (임시)",qty:10,repeat:"",memo:"",tel:"010-2222-0005"},
  {id:8,date:off(2),type:"경로당",place:"경로당 33 (임시)",qty:5,repeat:"",memo:"",tel:"010-1111-0033"},
  {id:9,date:off(-1),type:"경로당",place:"경로당 03 (임시)",qty:4,repeat:"",memo:"",tel:"010-1111-0003",done:true},
];

const $ = id => document.getElementById(id);
const DOW = ["일","월","화","수","목","금","토"];
let cur = iso(base), filter = "all";

function label(s){
  const d = new Date(s+"T00:00:00");
  const diff = Math.round((d - new Date(iso(base)+"T00:00:00"))/864e5);
  const rel = diff===0?"오늘":diff===1?"내일":diff===-1?"어제":"";
  return `${d.getMonth()+1}월 ${d.getDate()}일 (${DOW[d.getDay()]})<small>${rel||"&nbsp;"}</small>`;
}
function shift(n){ const d=new Date(cur+"T00:00:00"); d.setDate(d.getDate()+n); cur=iso(d); render(); }

function render(){
  $("dateLabel").innerHTML = label(cur);
  const all = ORDERS.filter(o=>o.date===cur);
  const done = all.filter(o=>o.done).length;
  $("sPlaces").textContent = all.length;
  $("sQty").textContent = all.reduce((a,o)=>a+o.qty,0);
  $("sDone").textContent = `${done}/${all.length}`;
  $("progress").style.width = all.length ? (done/all.length*100)+"%" : "0";

  const rows = all.filter(o => filter==="all" || (filter==="todo" ? !o.done : o.type===filter));
  const list = $("list"); list.innerHTML = "";
  if(!rows.length){ list.innerHTML = '<div class="empty">이 날짜에 표시할 배달이 없습니다</div>'; return; }
  rows.forEach((o,i)=>{
    const el = document.createElement("div");
    el.className = "item"+(o.done?" done":"");
    el.innerHTML = `<div class="no">${i+1}</div>
      <div class="info"><b></b><small></small></div>
      <div class="qty">${o.qty}<small> 모</small></div>
      <button class="chk">${o.done?"완료됨":"배달완료"}</button>`;
    el.querySelector("b").textContent = o.place;
    if(o.repeat){ const t=document.createElement("span"); t.className="tag rep"; t.textContent=o.repeat; el.querySelector("b").append(t); }
    el.querySelector("small").textContent = o.tel + (o.memo ? " · "+o.memo : "");
    el.querySelector(".chk").onclick = ()=>{ o.done=!o.done; render(); };
    list.append(el);
  });
}

$("prev").onclick=()=>shift(-1);
$("next").onclick=()=>shift(1);
$("today").onclick=()=>{cur=iso(base);render();};
$("dateLabel").onclick=()=>{ $("picker").value=cur; $("picker").showPicker?.(); };
$("picker").onchange=e=>{ if(e.target.value){cur=e.target.value;render();} };
document.querySelectorAll("#filters button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("#filters button").forEach(x=>x.classList.remove("on"));
  b.classList.add("on"); filter=b.dataset.f; render();
});
render();
</script>
</body>
</html>
